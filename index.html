<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#7c3aed">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Stage Star — Musical Rehearsal</title>
  <link rel="manifest" href="manifest.json">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bubblegum+Sans&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div id="app">
    <!-- Screen: Home / Musical Picker -->
    <div id="screen-home" class="screen active">
      <header class="app-header">
        <h1 class="app-title">🎭 Stage Star</h1>
        <p class="app-subtitle">Pick your show!</p>
      </header>
      <div id="musicals-grid" class="card-grid"></div>
      <button id="btn-add-musical" class="btn btn-big btn-add" title="Add a new musical">
        <span class="btn-icon">＋</span>
        <span class="btn-label">Add Musical</span>
      </button>
    </div>

    <!-- Screen: Song Picker -->
    <div id="screen-songs" class="screen">
      <header class="app-header">
        <button id="btn-back-home" class="btn btn-back" title="Back to musicals">◀</button>
        <h1 id="musical-title" class="app-title"></h1>
        <button id="btn-view-script" class="btn btn-accent" title="View Script">📜 Script</button>
        <button id="btn-edit-musical" class="btn btn-small btn-edit" title="Edit musical">⚙️</button>
      </header>
      <div id="songs-grid" class="card-grid"></div>
    </div>

    <!-- Screen: Player -->
    <div id="screen-player" class="screen">
      <header class="app-header">
        <button id="btn-back-songs" class="btn btn-back" title="Back to songs">◀</button>
        <h1 id="song-title" class="app-title"></h1>
        <button id="btn-player-script" class="btn btn-accent hidden" title="View Script">📜 Script</button>
      </header>
      <div class="player-container">
        <div class="waveform-section">
          <div class="waveform-label label-guide">🎤 With Singing</div>
          <div id="waveform-guide" class="waveform"></div>
          <div class="waveform-label label-accomp">🎵 Music Only</div>
          <div id="waveform-accomp" class="waveform"></div>
        </div>
        <div class="track-toggle">
          <button id="btn-toggle-guide" class="btn btn-toggle active" data-track="guide">🎤 With Singing</button>
          <button id="btn-toggle-accomp" class="btn btn-toggle" data-track="accomp">🎵 Music Only</button>
        </div>
        <div class="player-time">
          <span id="time-current">0:00</span>
          <span class="time-sep">/</span>
          <span id="time-total">0:00</span>
        </div>
        <div class="player-controls">
          <button id="btn-skip-back" class="btn btn-control" title="Skip back 5 seconds">⏪ 5s</button>
          <button id="btn-play" class="btn btn-play" title="Play / Pause">▶️</button>
          <button id="btn-skip-forward" class="btn btn-control" title="Skip forward 5 seconds">5s ⏩</button>
        </div>
        <div class="loop-controls">
          <button id="btn-loop-start" class="btn btn-loop" title="Set loop start">🅰️ Start</button>
          <button id="btn-loop-end" class="btn btn-loop" title="Set loop end">🅱️ End</button>
          <button id="btn-loop-clear" class="btn btn-loop btn-loop-clear hidden" title="Clear loop">✖ Clear Loop</button>
        </div>
      </div>
    </div>

    <!-- Screen: Upload / Setup -->
    <div id="screen-upload" class="screen">
      <header class="app-header">
        <button id="btn-back-upload" class="btn btn-back" title="Back">◀</button>
        <h1 class="app-title">🎬 Set Up Musical</h1>
      </header>
      <div class="upload-container">
        <div class="upload-step" id="upload-step-name">
          <label class="upload-label" for="input-musical-name">Musical Name</label>
          <input type="text" id="input-musical-name" class="input-text" placeholder="e.g. Raise Your Voice" autocomplete="off">
        </div>

        <div class="upload-step" id="upload-step-script">
          <label class="upload-label">Script (optional PDF)</label>
          <div class="drop-zone" id="drop-zone-script">
            <span class="drop-zone-text">📜 Drop PDF here or tap to browse</span>
            <input type="file" id="input-script" accept=".pdf" class="drop-zone-input">
          </div>
          <div id="script-file-name" class="file-name-display"></div>
        </div>

        <div class="upload-step" id="upload-step-guide">
          <label class="upload-label">🎤 Guide Vocal Tracks</label>
          <div class="drop-zone" id="drop-zone-guide">
            <span class="drop-zone-text">Drop audio files or a folder here</span>
          </div>
          <div class="browse-buttons">
            <button type="button" class="btn btn-small btn-browse" id="btn-browse-guide-files">📁 Browse Files</button>
            <button type="button" class="btn btn-small btn-browse" id="btn-browse-guide-folder">📂 Browse Folder</button>
          </div>
          <input type="file" id="input-guide-files" accept="audio/*" multiple class="hidden-input">
          <input type="file" id="input-guide-folder" accept="audio/*" multiple class="hidden-input" webkitdirectory>
          <div id="guide-file-list" class="file-list"></div>
        </div>

        <div class="upload-step" id="upload-step-accomp">
          <label class="upload-label">🎵 Accompaniment Tracks</label>
          <div class="drop-zone" id="drop-zone-accomp">
            <span class="drop-zone-text">Drop audio files or a folder here</span>
          </div>
          <div class="browse-buttons">
            <button type="button" class="btn btn-small btn-browse" id="btn-browse-accomp-files">📁 Browse Files</button>
            <button type="button" class="btn btn-small btn-browse" id="btn-browse-accomp-folder">📂 Browse Folder</button>
          </div>
          <input type="file" id="input-accomp-files" accept="audio/*" multiple class="hidden-input">
          <input type="file" id="input-accomp-folder" accept="audio/*" multiple class="hidden-input" webkitdirectory>
          <div id="accomp-file-list" class="file-list"></div>
        </div>

        <div class="upload-step" id="upload-step-match">
          <label class="upload-label">Matched Songs</label>
          <div id="matched-songs-list" class="matched-list"></div>
        </div>

        <div class="upload-actions">
          <button id="btn-save-musical" class="btn btn-big btn-save" disabled>💾 Save Musical</button>
        </div>
      </div>
    </div>

    <!-- Script Viewer Modal -->
    <div id="modal-script" class="modal hidden">
      <div class="modal-content">
        <button id="btn-close-script" class="btn btn-back modal-close" title="Close">✖</button>
        <embed id="script-viewer" type="application/pdf" width="100%" height="100%">
      </div>
    </div>

    <!-- Loading overlay -->
    <div id="loading-overlay" class="loading-overlay hidden">
      <div class="spinner"></div>
      <p class="loading-text">Loading...</p>
    </div>
  </div>

  <script src="js/app.js" type="module"></script>
</body>
</html>
